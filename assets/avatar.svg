<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="50%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>

    <!-- Ring Border Gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Monogram Fill Gradient -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGradient)" stroke="url(#ringGradient)" stroke-width="2.5" />

  <!-- Inner Soft Ring -->
  <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Geometric Modern N Monogram -->
  <g transform="translate(42, 38)">
    <!-- Left vertical bar -->
    <path d="M 10 10 L 22 10 L 22 74 L 10 74 Z" fill="url(#letterGradient)" rx="4" />
    <!-- Right vertical bar -->
    <path d="M 54 10 L 66 10 L 66 74 L 54 74 Z" fill="url(#letterGradient)" rx="4" />
    <!-- Diagonal crossbar -->
    <path d="M 18 10 L 32 10 L 58 64 L 44 64 Z" fill="url(#letterGradient)" />
  </g>

  <!-- Modern Accent Dot -->
  <circle cx="112" cy="48" r="4.5" fill="#38bdf8" />
</svg>
