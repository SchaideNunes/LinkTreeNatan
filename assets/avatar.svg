<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#avatarGlow)" stroke="#ffffff" stroke-width="3" />
  
  <!-- Subtle inner shadow ring -->
  <circle cx="80" cy="80" r="71" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Crown Icon on Top -->
  <path d="M 64 54 L 68 62 L 80 50 L 92 62 L 96 54 L 98 67 L 62 67 Z" 
        fill="url(#crestGold)" />
  <circle cx="64" cy="52" r="2.5" fill="#ffffff" />
  <circle cx="80" cy="48" r="2.5" fill="#ffffff" />
  <circle cx="96" cy="52" r="2.5" fill="#ffffff" />

  <!-- Monogram Logo (N) with Crest Styling -->
  <text x="80" y="112" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="-1px" 
        text-anchor="middle" 
        fill="url(#crestGold)">N</text>
  
  <!-- Subtle baseline underline accent -->
  <rect x="66" y="120" width="28" height="2.5" rx="1.25" fill="#ffffff" opacity="0.8" />
</svg>
